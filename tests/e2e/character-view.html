<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createSamurai } from '/src/character.js';
import { SamuraiAnimator } from '/src/animation.js';
const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9a9488);
scene.add(new THREE.HemisphereLight(0xaebbd0, 0x8a6f3c, 1.3));
const sun = new THREE.DirectionalLight(0xffcf98, 3.2); sun.position.set(3, 4, 5); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x6b5a34 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const views = (params.get('views') || 'front,side,back,threequarter').split(',');
const state = { speed: Number(params.get('speed') || 0), grounded: params.get('air') ? false : true, vy: Number(params.get('vy') || 0), facing: 0, sprinting: false, windGust: 0.5 };
const W = innerWidth / views.length;
const cams = [];
const models = views.map((v, i) => {
  const m = createSamurai();
  const a = new SamuraiAnimator(m);
  for (let k = 0; k < Number(params.get('frames') || 30); k++) a.update(1 / 30, state);
  m.root.position.x = i * 10;
  scene.add(m.root);
  const cam = new THREE.PerspectiveCamera(35, W / innerHeight, 0.1, 100);
  const ang = { front: 0, side: Math.PI / 2, back: Math.PI, threequarter: Math.PI / 4, left: -Math.PI / 2 }[v];
  cam.position.set(i * 10 + Math.sin(ang) * 3.6, 1.1, Math.cos(ang) * 3.6);
  cam.lookAt(i * 10, 0.95, 0);
  cams.push(cam);
  return m;
});
renderer.setScissorTest(true);
cams.forEach((cam, i) => { renderer.setViewport(i * W, 0, W, innerHeight); renderer.setScissor(i * W, 0, W, innerHeight); renderer.render(scene, cam); });
window.__done = true;
</script></body></html>
